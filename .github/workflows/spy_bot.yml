name: SPY Bot Scheduler

on:
  schedule:
    # يشتغل كل 5 دقائق (بتوقيت UTC) على مدار الساعة، 24/7 بدون توقف —
    # مناسب للكريبتو لأنه يتداول طوال أيام الأسبوع بدون إغلاق.
    # السكربت نفسه (main.py) يرسل ملخص يومي مرة عند منتصف الليل UTC،
    # وبعدها يفحص إشارات تداول في باقي التشغيلات.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # يسمح لك بتشغيله يدوياً من تبويب Actions للاختبار

env:
  CRYPTO_SYMBOL: "BTC-USD"   # غيّرها لأي عملة ثانية مثل ETH-USD أو SOL-USD

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SPY bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
