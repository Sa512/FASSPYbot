name: SPY Bot Scheduler

on:
  schedule:
    # يشتغل كل 5 دقائق (بتوقيت UTC) على مدار الساعة، طوال أيام الأسبوع.
    # السكربت نفسه (main.py) يتحقق داخلياً من ساعات تداول نيويورك
    # ويقرر هل يرسل رسالة افتتاح / إغلاق / فحص إشارة، أو ما يسوي شي.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # يسمح لك بتشغيله يدوياً من تبويب Actions للاختبار

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SPY bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
